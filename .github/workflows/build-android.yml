name: Build Cavadas Tactical Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reset npm cache
        run: |
          npm cache clean --force
          rm -rf node_modules

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build WebApp
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Recreate Android platform if incomplete
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "android/gradlew não existe. A recriar plataforma Android..."
            rm -rf android
            npx cap add android
          else
            echo "Plataforma Android válida encontrada."
          fi

      - name: Capacitor sync Android
        run: npx cap sync android

      - name: Apply Android icons
        run: |
          if [ -f "scripts/apply-android-icons.cjs" ]; then
            node scripts/apply-android-icons.cjs || true
          fi

          if [ -d "V9_2_ICON_2YOU_PACKAGE" ]; then
            find V9_2_ICON_2YOU_PACKAGE -type d -name "mipmap-*" | while read dir; do
              base=$(basename "$dir")
              mkdir -p "android/app/src/main/res/$base"
              cp -R "$dir"/* "android/app/src/main/res/$base/" || true
            done
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cavadas-Tactical-APK
          path: android/app/build/outputs/apk/debug/*.apk
